[package]
name = "external-iot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "IoT device manager external module for the Unified server: device registry with per-device API keys, telemetry ingestion with rate limits and aggregates, device twins, command queue, alert rules, and fleet health. In-memory store; HTTP ingestion only, no MQTT broker embedded."
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
# The only Unified crate an external module may depend on.
unified-core = { path = "../unified-core" }
# Shared versions come from the root workspace [workspace.dependencies].
actix-web.workspace = true
base64.workspace = true
chrono.workspace = true
dashmap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
