[package]
name = "unified-scripting"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
description = "TypeScript external-module runtime for Unified: QuickJS execution with the Unified global SDK object, OXC transpiling in-memory."
publish = false

[dependencies]
actix-web.workspace = true
diesel.workspace = true
futures-util.workspace = true
log.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rquickjs = "0.14"
serde.workspace = true
serde_json.workspace = true
unified-core = { path = "../unified-core" }
unified-ts = { path = "../unified-ts" }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
