# Unified Pentagonal Project — example configuration.
# Copy this file to `config.yaml` and adjust it. All values are optional;
# missing values fall back to the built-in defaults.
# Run `unified -t` to test a configuration file before using it.

# ----------------------------------------
# Application configuration
# ----------------------------------------
app:
  # Application mode: development or production. Default: production.
  mode: "production"
  # Dashboard path. Default: dashboard.
  dashboard_path: "dashboard"
  # Session cookie name. Default: vault.
  session_name: "vault"
  # CSRF token lifetime in minutes (5..86400). Default: 30.
  csrf_duration: 30
  # Secret and salt keys. Both are mandatory in every mode:
  # secret_key must be at least 32 characters, salt_key at least
  # 16 characters, and they must differ. Startup refuses to boot
  # (and reload refuses to apply) until both hold real random
  # values — the placeholder values below are rejected.
  secret_key: "change-this-to-a-random-secret-string"
  salt_key: "change-this-to-a-random-salt-string"
  # Sunset date (YYYY-MM-DD) for legacy unpeppered API-key hashes:
  # on or after this date a key stored under the plain SHA-256
  # digest stops authenticating and its owner must rotate it.
  # Empty means the built-in default (2027-03-01).
  apikey_legacy_hash_sunset: ""
  # System user the daemon runs as (empty means auto-detect).
  user: ""
  # TCP listen addresses.
  tcp:
    - "127.0.0.1:8080"
  # TLS configuration.
  ssl:
    # Automatically create a certificate when no certificate matches.
    auto_create: false
    # TLS listen addresses.
    listen:
      - "127.0.0.1:8443"
    # Default certificate and key files.
    cert: ""
    key: ""
    # TLS session cache size in MB (2..256). Default: 32.
    ssl_session_cache: 32
    # Per-domain / per-IP certificates.
    domains:
      "127.0.0.1":
        cert: ""
        key: ""
  # Workers, 0 means auto-detect. Default: 0.
  workers: 0
  # Operation timeout in seconds (1..3600). Default: 10.
  operation_timeout: 10
  # Request timeout in seconds (0 disables it). Default: 10.
  request_timeout: 10
  # Disconnect timeout in seconds. Default: 5.
  disconnect_timeout: 5
  # Maximum concurrent connections. Default: 25000.
  max_connections: 25000
  # Per-worker maximum concurrent TLS connections (0 means auto).
  max_connections_rate: 0
  # Listen backlog. Default: 4096.
  backlog: 4096
  # Maximum open file descriptors. Default: 65535.
  rlimit_nofile: 65535
  # Keep-alive timeout in seconds (0 disables it). Default: 75.
  keep_alive: 75
  # Automatic memory cleanup.
  auto_clean_memory: true
  auto_clean_memory_size: "384M"
  auto_clean_memory_interval: "1H"

# ----------------------------------------
# Cache configuration
# ----------------------------------------
cache:
  # Directory for the filesystem cache adapter (used when redis.enabled
  # is false). Relative paths resolve against the working directory.
  dir: "data/cache"
  # Default time-to-live for cache entries in seconds. 0 means entries
  # never expire unless a per-entry TTL is given.
  default_ttl_secs: 3600
  # Maximum entries kept by the filesystem cache adapter. 0 means
  # unlimited; past the limit the oldest entries are evicted.
  max_entries: 10000
  # When true and Redis is enabled, a Redis failure at runtime falls
  # back to the filesystem adapter instead of failing the request.
  failover_enabled: true

# ----------------------------------------
# Redis configuration
# ----------------------------------------
redis:
  # Enable the Redis cache adapter. When false, the filesystem cache
  # adapter is used instead.
  enabled: false
  unix_socket: ""
  host: "localhost"
  port: 6379
  username: ""
  password: ""
  database: 0
  max_pools: 10
  minimum_idle_connections: 1
  idle_timeout: 600
  connect_timeout: 5

# ----------------------------------------
# Database configuration (PostgreSQL by default)
# ----------------------------------------
database:
  driver: "postgresql"
  socket: null
  host: "localhost"
  port: 5432
  username: ""
  password: ""
  database: ""
  max_connections: 50
  min_connections: 1
  max_lifetime: 1800
  statement_timeout: 5
  idle_timeout: 600
  acquire_timeout: 10
  log_enable: false
  log_level: "warn"
  log_slow_level: "error"
  log_threshold: 1
  collation: "utf8mb4_general_ci"

# ----------------------------------------
# Licenses / API keys
# ----------------------------------------
licenses:
  # MaxMind license key used to download GeoLite databases.
  maxmind: ""

# ----------------------------------------
# Geo location configuration
# ----------------------------------------
geo:
  # Path to the GeoLite / MaxMind database file.
  database_path: "data/geo/GeoLite2-City.mmdb"
  # Download URL for the database. Empty means the built-in MaxMind URL.
  download_url: ""
  auto_update: false
  update_interval_hours: 168
  # When true, settings-defined IP range overrides win over the GeoLite
  # database reading (default behaviour).
  settings_override: true

# ----------------------------------------
# Let's Encrypt ACME configuration
# ----------------------------------------
acme:
  # Enable ACME certificate issuance and renewal.
  enabled: false
  # ACME directory URL.
  directory_url: "https://acme-v02.api.letsencrypt.org/directory"
  # Contact addresses for the ACME account.
  contacts: []

# ----------------------------------------
# Store configuration
# ----------------------------------------
store:
  # Secret key that signs expiring download links (HMAC-SHA256).
  # When set (at least 32 characters), signed links survive restarts
  # because the same key is used on every start. When empty, the store
  # generates a random per-process secret and logs a warning; links
  # signed before a restart then stop verifying. Changing the value
  # invalidates previously signed links and requires a restart to
  # take effect.
  download_signing_secret: ""

# ----------------------------------------
# Security hardening configuration
# ----------------------------------------
security:
  # Master switch for the whole hardening pipeline. Default: true.
  enabled: true
  # Brute-force protection.
  brute_force_enabled: true
  brute_force_max_failures: 5
  brute_force_account_max_failures: 5
  brute_force_window_secs: 900
  brute_force_base_lockout_secs: 300
  brute_force_lockout_multiplier: 2
  brute_force_max_lockout_secs: 3600
  # Rate limiting.
  rate_limit_enabled: true
  rate_limit_per_ip_requests: 300
  rate_limit_per_ip_window_secs: 60
  rate_limit_per_user_requests: 600
  rate_limit_per_user_window_secs: 60
  rate_limit_per_endpoint_requests: 120
  rate_limit_per_endpoint_window_secs: 60
  # Path prefixes exempt from rate limiting and the blocklist. The
  # ACME HTTP-01 challenge prefix must stay here: a blocked or
  # throttled challenge would break certificate issuance and renewal.
  rate_limit_exempt_paths:
    - "/health"
    - "/.well-known/acme-challenge/"
  # Flood (burst) detection and per-IP concurrency.
  flood_burst_threshold: 100
  flood_burst_window_secs: 10
  max_concurrent_per_ip: 50
  # Request body limits in bytes.
  max_body_bytes_default: 1048576
  max_body_bytes_upload: 104857600
  upload_path_prefixes:
    - "/api/v1/files"
    - "/api/v1/storage"
  # Response headers. An empty value disables that header.
  headers_hsts: "max-age=31536000; includeSubDomains"
  headers_content_type_options: "nosniff"
  headers_frame_options: "DENY"
  headers_referrer_policy: "strict-origin-when-cross-origin"
  headers_content_security_policy: "default-src 'self'; frame-ancestors 'none'"
  headers_permissions_policy: "camera=(), microphone=(), geolocation=()"
  # Failed-auth alert clustering and IP reputation.
  failed_auth_alert_threshold: 5
  failed_auth_alert_window_secs: 900
  ip_reputation_flag_threshold: 100
  ip_reputation_burst_penalty: 25
  # CIDR ranges or bare IPs that bypass rate limiting / are rejected
  # with 403. Empty by default.
  allowlist: []
  blocklist: []
  # CIDR ranges or bare IPs of trusted reverse proxies / load
  # balancers. Only a TCP peer inside this list may supply the client
  # IP through X-Forwarded-For. Empty by default: with no trusted
  # proxies the peer address is always the client IP, so a direct
  # client can never spoof the IP the blocklist, rate limiter, and
  # brute-force engine enforce on. Add entries ONLY for proxies you
  # operate that overwrite X-Forwarded-For themselves.
  trusted_proxies: []

# ----------------------------------------
# Public API configuration
# ----------------------------------------
api:
  # Segment placed before the version in public URLs: "v" produces
  # /v1/..., /v2/... Default: v.
  prefix: "v"
  # When true, the deployment intends to also remount the internal
  # /api/v1/<module> routes under the new prefix on the next startup.
  # A flag only: the remount itself happens in the server factory.
  migrate_internal: false
  # Version served when a caller asks for no version explicitly.
  # Default: v1.
  default_version: "v1"
  # Default per-version rate limit, requests per minute. Default: 1000.
  default_rate_limit_per_minute: 1000
  # Whether callers must authenticate for a version by default.
  default_auth_required: true

# ----------------------------------------
# Named page routes
# ----------------------------------------
# Override the built-in path of a named page. Every field is optional;
# an absent field leaves the default in place. The previous path keeps
# working as a permanent (301) redirect to the new path (latest-only:
# at most one redirect per route). Paths must start with "/", must not
# fall under /api/, /.well-known/, /assets/ or /theme/, and must not
# conflict with another route's path. The legacy app.dashboard_path
# value is honoured as the user_dashboard override when this section
# does not set it.
routes:
  login: "/login"
  register: "/register"
  forgot_password: "/forgot-password"
  reset_password: "/reset-password"
  logout: "/logout"
  user_dashboard: "/dashboard"
  admin_dashboard: "/admin"
  status_page: "/status"

# ----------------------------------------
# Storage configuration
# ----------------------------------------
storage:
  # Name of the default target, when one is configured.
  default_target: null
  # Extra allowed endpoint hosts, for self-hosted S3-compatible
  # endpoints (exact hostnames, for example minio.example.com).
  allowed_hosts: []
  # Targets registered at startup. A target that fails validation is
  # skipped with a warning, so one bad target never prevents startup.
  targets:
    - name: "local"
      kind: "local"
      base_dir: "data/storage"

# ----------------------------------------
# Documents configuration (chunked uploads)
# ----------------------------------------
documents:
  # Temp files directory for chunked-upload part spool files.
  # Null means the default under the local storage root
  # (`<storage>/temps/uploads`, session directories nested by UTC
  # date: `<root>/YYYY/MM/DD/<session-id>`). Applies to sessions
  # created after the change; in-flight sessions keep the directory
  # they started in.
  spool_dir: null
  # Maximum chunk data held in RAM in bytes (100 MiB .. 8 GiB,
  # default 100 MiB). Bounds the in-RAM buffering of the
  # chunked-upload path; parts always spill to disk, the cap is
  # the safety ceiling.
  max_chunk_ram_bytes: null
  # Extension -> content-kind overrides for the extension registry
  # (merged over the shipped defaults in
  # src/modules/documents/extension_kinds.yaml). Keys are
  # lowercased; values must be documents, media, or others.
  # Example:
  # extensions:
  #   heic: media
  #   pages: documents
  extensions: null

# ----------------------------------------
# Runtime asset configuration (JS/CSS minification)
# ----------------------------------------
assets:
  # Minify the JavaScript and CSS served by the runtime asset
  # pipeline: the dashboard TypeScript sources are transpiled to
  # JavaScript at startup and minified before they are served, and
  # the stylesheets under assets/css/ are minified the same way.
  # Null (default) means automatic: minify unless the application
  # runs in development mode (app.mode == "development"). True
  # always minifies, false never minifies. Takes effect at startup
  # only; changing it requires a restart, like the TypeScript
  # compilation itself.
  minify: null

# ----------------------------------------
# Load balancer configuration
# ----------------------------------------
load_balancer:
  # Default health-check interval in seconds (5..3600). Default: 30.
  health_check_interval_secs: 30
  # Default health-check timeout in seconds (1..60). Default: 5.
  health_check_timeout_secs: 5
  # Default health-check path for HTTP checks. Default: /health.
  health_check_path: "/health"
  # Default strategy: round_robin | least_connections | weighted |
  # ip_hash. Default: round_robin.
  default_strategy: "round_robin"
  # Maximum backends per balancer (1..1000). Default: 100.
  max_backends_per_balancer: 100

# ----------------------------------------
# Pingora gateway configuration
# ----------------------------------------
# The gateway only listens when enabled is true AND the binary was
# built with the `gateway` Cargo feature. Until then the gateway runs
# disabled and rules are managed through the management API only.
gateway:
  enabled: false
  listen:
    - "127.0.0.1:8081"
  tls_listen:
    - "127.0.0.1:8444"
  # Default upstream when no routing rule matches: a load balancer id
  # (UUID) or a plain host:port address. Empty means unmatched
  # requests are rejected.
  default_upstream: null
  # Request-log ring buffer capacity (1..10000). Default: 500.
  request_log_capacity: 500
  # Health-check sweep interval in seconds (5..3600). Default: 30.
  health_check_interval_secs: 30
  # Upstream connect timeout in seconds (1..60). Default: 5.
  connect_timeout_secs: 5

# ----------------------------------------
# System records configuration
# ----------------------------------------
records:
  # Default retention in days. Records older than this are removed
  # only by the explicit, confirmed retention purge. Default: 365.
  retention_days: 365
